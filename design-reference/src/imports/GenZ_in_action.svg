<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%">
  <defs>
    <!-- Text Gradient matching the app headers -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bce3ff" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background for Preview Contrast -->
  <rect width="400" height="180" rx="16" fill="#071b2e" />

  <!-- Typography Group - Centered within the ViewBox -->
  <!-- ViewBox width is 400. Centering point is 200. -->
  <g transform="translate(200, 75)">
    <!-- "GENZ" with Stroke & Gradient -->
    <!-- Font size 52 -->
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="url(#textGradient)" letter-spacing="2.5" text-anchor="middle" filter="url(#softGlow)">GENZ</text>
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="none" stroke="#004488" stroke-width="2.5" letter-spacing="2.5" text-anchor="middle">GENZ</text>

    <!-- "IN ACTION" with Stroke & Gradient -->
    <!-- Font size 34 -->
    <!-- Original Y offset was 44. New tighter offset is 38. -->
    <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="url(#textGradient)" letter-spacing="2" text-anchor="middle">IN ACTION</text>
    <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="none" stroke="#004488" stroke-width="2" letter-spacing="2" text-anchor="middle">IN ACTION</text>
  </g>
</svg>
